name: CB calculator
on:
  schedule:
    - cron: '4 20 * * *' # Daily at 20:04 AM UTC
  workflow_dispatch:
  pull_request:
  push:
    branches: main

jobs:
  run:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@main
      with:
        ref: ${{ github.head_ref }}
        fetch-depth: 0

    - uses: actions/setup-python@main

    - name: Run the CB calculator
      run: |
        git clone https://github.com/2dos/DK64-Randomizer
        cp -f cb_calc.py DK64-Randomizer
        cd DK64-Randomizer # Some of the python scripts care about the cwd
        python -u cb_calc.py
        cp -f requirement_data.js ..

    - name: Push requirement data changes
      run: |
        git add requirement_data.js
        CHANGED_FILES=0
        git diff --cached --quiet --exit-code || CHANGED_FILES=$?
        if [ $CHANGED_FILES -eq 0 ]; then exit 0; fi # If no staged files, exit the script

        git config --global user.email "dk64cbcalculator@github.com"
        git config --global user.name "DK64 CBCalc Nightly"
        git commit -m "Updated CB requirement data"
        git push
