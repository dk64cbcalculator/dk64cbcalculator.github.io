name: Import settings string

on:
  workflow_dispatch:
    inputs:
      settings_string:
        required: true
      key:
        required: true
      name:
        required: true

jobs:
  import:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@main

    - uses: actions/setup-python@main

    - name: Import the settings string
      # Inputs go through env (instead of inline) to avoid shell injection
      env:
        SETTINGS: ${{ inputs.settings_string }}
        NAME: ${{ inputs.name }}
        KEY: ${{ inputs.key }}
      run: |
        git clone https://github.com/2dos/DK64-Randomizer
        git clone -b master https://github.com/2dos/DK64-Randomizer DK64-Randomizer-v5
        pip install protobuf
        python import_settings_string.py "$SETTINGS" "$NAME" "$KEY"

    - name: Open a pull request
      env:
        GH_TOKEN: ${{ github.token }}
        NAME: ${{ inputs.name }}
      run: |
        BRANCH="settings-import-${{ github.run_number }}"
        git checkout -b "$BRANCH"
        git add presets.json index.html

        git config --global user.email "dk64cbcalculator@github.com"
        git config --global user.name "DK64 CBCalc Nightly"
        git commit -m "Add preset '$NAME'"
        git push -u origin "$BRANCH"

        gh pr create --base main --head "$BRANCH" --title "Add preset '$NAME'" --body "Created via import_settings.yml"
