        <div class="container">
            <div class="container-header">
                <h1>DK64 Randomizer Medal Move Requirement Calculator</h1>
            </div>
            <div class="card mb-3">
                <div class="card-body">
                    <div class="d-flex">
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="cb-req-desc">Medal Requirement</span>
                            <input type="number" id="cb-req-count" class="form-control recalculate" placeholder="Medal Requirement" aria-label="Medal Requirement" value="40" aria-describedby="cb-req-desc"/>
                        </div>
                        <div class="ps-3 mb-3">
                            <button type="button" class="btn btn-primary config-button" data-bs-toggle="modal" data-bs-target="#barrierModal" style="height:100%">
                                <i class="fa-solid fa-gear"></i>
                            </button>
                        </div>
                    </div>
                    <div class="input-group mb-3">
                        <select class="form-select recalculate" aria-label="Select Level" id="medal-level">
                            <option selected value="default" disabled="disabled">Level</option>
                            <option value="Japes">Jungle Japes</option>
                            <option value="Aztec">Angry Aztec</option>
                            <option value="Factory">Frantic Factory</option>
                            <option value="Galleon">Gloomy Galleon</option>
                            <option value="Fungi">Fungi Forest</option>
                            <option value="Caves">Crystal Caves</option>

                        </select>
                    </div>
                    <div class="input-group mb-3">
                        <select class="form-select recalculate" aria-label="Select Kong" id="medal-kong">
                            <option selected value="default" disabled="disabled">Kong</option>
                            <option value="DK">DK</option>
                            <option value="Diddy">Diddy</option>
                            <option value="Lanky">Lanky</option>
                            <option value="Tiny">Tiny</option>
                            <option value="Chunky">Chunky</option>
                        </select>

                    <hr />
                    <h4>Presets</h4>

                    <div class="d-flex">
                        <select class="form-select" aria-label="Presets" id="preset_selector"></select>
                        <div class="ps-3">
                            <button type="button" class="btn btn-secondary" onclick="applyPreset()">
                                Apply
                            </button>
                        </div>

                            <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#customPresetModal">
                                Edit
                            </button>

            <div id="permutations"></div>
        </div>


        <script>
            getMedalRequirement = () => {
                let interpreted_value = document.getElementById("cb-req-count").value;
                if (interpreted_value == "") {
                    interpreted_value = "0";
                }
                return parseInt(interpreted_value);
            }

            class Level {
                static Japes = new Level("Japes");
                static Aztec = new Level("Aztec");
                static Factory = new Level("Factory");
                static Galleon = new Level("Galleon");
                static Fungi = new Level("Fungi");
                static Caves = new Level("Caves");
                static Castle = new Level("Castle");

                constructor (name) {
                    this.name = name;
                }
            }

            class Kong {
                static DK = new Kong("DK");
                static Diddy = new Kong("Diddy");
                static Lanky = new Kong("Lanky");
                static Tiny = new Kong("Tiny");
                static Chunky = new Kong("Chunky");

                constructor (name) {
                    this.name = name;
                }
            }

            class Moves {
                // Tags for moves related to guns/instruments, so they can be collapsed
                static GunMove = class GunMove extends Moves {};
                static InstrumentMove = class InstrumentMove extends Moves {};

                static Moveless = new Moves("Nothing", false);
                static LevelSlam = new Moves("Level Slam");
                static Slam = new Moves("Green Slam");
                // Kongs
                static Diddy = new Moves("Diddy");
                static Enguarde = new Moves("Enguarde");
                // Special Moves
                static Strong = new Moves("Strong Kong");
                static Blast = new Moves("Baboon Blast");
                static Grab = new Moves("Gorilla Grab");
                static Rocket = new Moves("Rocketbarrel Boost");
                static Spring = new Moves("Simian Spring");
                static Charge = new Moves("Chimpy Charge");
                static Orangstand = new Moves("Orangstand");
                static Balloon = new Moves("Baboon Balloon");
                static Sprint = new Moves("Sprint");
                static Mini = new Moves("Mini Monkey");
                static Twirl = new Moves("Ponytail Twirl");
                static Monkeyport = new Moves("Monkeyport");
                static Hunky = new Moves("Hunky Chunky");
                static Punch = new Moves("Primate Punch");
                static Gone = new Moves("Gorilla Gone");
                // Training
                static Diving = new Moves("Diving");
                static Vines = new Moves("Vines");
                static Barrels = new Moves("Barrels");
                static Climbing = new Moves("Climbing");
                static Oranges = new Moves("Oranges");
                // Guns
                static Coconut = new Moves.GunMove("Coconut");
                static Peanut = new Moves.GunMove("Peanut");
                static Grape = new Moves.GunMove("Grape");
                static Feather = new Moves.GunMove("Feather");
                static Pineapple = new Moves.GunMove("Pineapple");
                static CheckOfLegends = new Moves.GunMove("All 5 Guns");
                static AnyGun = new Moves("Any Gun");
                // Instruments
                static Bongos = new Moves.InstrumentMove("Bongos");
                static Guitar = new Moves.InstrumentMove("Guitar");
                static Trombone = new Moves.InstrumentMove("Trombone");
                static Sax = new Moves.InstrumentMove("Sax");
                static Triangle = new Moves.InstrumentMove("Triangle");
                static AnyInstrument = new Moves("Any Instrument");
                // Warps
                static AztecW5Bonus = new Moves("Aztec Warp 5 Bonus Barrel");
                static CavesW3Bonus = new Moves("Caves Warp 3 Bonus Barrel");
                static AllWarps = new Moves("Preactivate All Warps");

                // Switchsanity (non-randomized)
                static JapesRambi = new Moves("Rambi Cage Gun", true, [[Moves.Coconut]], true);
                static JapesPainting = new Moves("Painting Room Gun", true, [[Moves.Peanut]], true);
                static JapesDiddyCave = new Moves("Peanut Gate Gun", true, [[Moves.Peanut]], true);
                static JapesFreeKong = new Moves("Free Diddy Gun", true, [[Moves.Coconut]], true);
                static GalleonCannonGame = new Moves("Cannon Game Gun", true, [[Moves.Pineapple]], true);
                static AztecGuitar = new Moves("Oasis Instrument Pad", true, [[Moves.Guitar]], true);
                static AztecBlueprintDoor = new Moves("Stone Door Gun", true, [[Moves.Coconut]], true);
                static AztecLlamaCoconut = new Moves("Llama Temple Gun", true, [[Moves.Coconut]], true);
                static AztecLlamaGrape = new Moves("Llama Temple Gun", true, [[Moves.Grape]], true);
                static AztecLlamaFeather = new Moves("Llama Temple Gun", true, [[Moves.Feather]], true);
                static AztecQuicksandSwitch = new Moves("Quicksand Tunnel Switch", true, [[Moves.LevelSlam]], true);

                // Switchsanity (random per seed)
                static JapesShellhiveRandom = new Moves.GunMove("Hive Area Gun");
                static JapesRambiRandom = new Moves.GunMove("Rambi Cage Gun");
                static JapesPaintingRandom = new Moves.GunMove("Painting Room Gun");
                static JapesDiddyCaveRandom = new Moves.GunMove("Peanut Gate Gun");
                static JapesFreeKongRandom = new Moves.GunMove("Free Diddy Gun");
                static AztecGuitarRandom = new Moves.InstrumentMove("Oasis Instrument Pad");
                static AztecBlueprintDoorRandom = new Moves.GunMove("Stone Door Gun");
                static AztecLlamaTempleRandom = new Moves.GunMove("Llama Temple Gun"); // No need to list out duplicates if they're random
                static AztecLlamaCoconutRandom = Moves.AztecLlamaTempleRandom;
                static AztecLlamaGrapeRandom = Moves.AztecLlamaTempleRandom;
                static AztecLlamaFeatherRandom = Moves.AztecLlamaTempleRandom;
                static GalleonLighthouseRandom = new Moves.GunMove("Lighthouse Area Gun");
                static GalleonPeanutRandom = new Moves.GunMove("Shipyard Area Gun");
                static GalleonCannonGameRandom = new Moves.GunMove("Cannon Game Gun");
                static ForestYellowTunnelRandom = new Moves.GunMove("Yellow Tunnel Gun");
                static ForestGreenTunnelFeatherRandom = new Moves.GunMove("Green Tunnel Gun 1");
                static ForestGreenTunnelPineappleRandom = new Moves.GunMove("Green Tunnel Gun 2");

                // Barriers
                static ClimbingCheck = new Moves("Climbing", true, [[Moves.Climbing]], true);
                static SlamCheck = new Moves("Green Slam", true, [[Moves.Slam]], true);
                static JapesShellhive = new Moves("Japes Shellhive Gate", true, [[Moves.Feather]], true);
                static GalleonLighthouse = new Moves("Lighthouse Side Open", true, [[Moves.Coconut]], true);
                static GalleonPeanut = new Moves("Shipyard Side Open", true, [[Moves.Peanut]], true);
                static ForestGreenTunnelPineapple = new Moves("Green Tunnel Opened (Pineapple)", true, [[Moves.Pineapple]], true);
                static ForestGreenTunnelFeather = new Moves("Green Tunnel Opened (Feather)", true, [[Moves.Feather]], true);
                static ForestYellowTunnel = new Moves("Yellow Tunnel Opened", true, [[Moves.Grape]], true);
                static Night = new Moves("Fungi Night", true, [[Moves.AnyGun]], true);
                static Day = new Moves("Fungi Day", true, [[Moves.AnyGun]], true);
                static CavesIglooPads = new Moves("Caves Igloo Pads Spawned", true, [[Moves.Rocket]], true);
                static CavesIceWalls = new Moves("Caves Ice Walls", true, [[Moves.Punch]], true);
                static CryptDKEntry = new Moves("Castle Crypt Doors", true, [[Moves.Coconut]], true);
                static CryptDiddyEntry = new Moves("Castle Crypt Doors", true, [[Moves.Peanut]], true);
                static CryptLankyEntry = new Moves("Castle Crypt Doors", true, [[Moves.Grape]], true);
                static CryptTinyEntry = new Moves("Castle Crypt Doors", true, [[Moves.Feather]], true);
                static CryptChunkyEntry = new Moves("Castle Crypt Doors", true, [[Moves.Pineapple]], true);

                // The more complex barriers have been moved out to barrier_data.js.

                constructor (name, requires_moves=true, barrier_moves=[[]], is_barrier=false) {
                    this.name = name;
                    this.requires_moves = requires_moves
                    this.barrier_moves = barrier_moves
                    this.is_barrier = is_barrier
                }
            }

            class Requirement {
                constructor (amount, requirements) {
                    this.amount = amount;
                    this.requirements = requirements;
                    this.amount_copy = amount;
                    this.requirements_copy = requirements.slice();
                }

                can_acquire(move_list) {
                    let acquire = false;
                    this.requirements.forEach(group => {
                        let local_acquire = true;
                        group.forEach(move => {
                            if (!move_list.includes(move)) {
                                local_acquire = false;
                            }
                        })
                        if (local_acquire) {
                            acquire = true;
                        }
                    })
                    return acquire;
                }

                reset() {
                    this.requirements = this.requirements_copy.slice();
                    this.amount = this.amount_copy;
                }
            }

            let opened_barriers = [];
            // Custom switchsanity barriers for this preset
            let switchsanity = new Map();

            // Dropdowns whose gate can be removed outright, rather than only switched to a different gun.

                if (openableBarriers.includes(select.id)) options.unshift("Opened");

                const vanilla = Moves[select.id.slice("select".length)].barrier_moves[0][0].name;
                for (let value of options) {

            function getBarrierRequirement(barrier) {
                if (barrier.is_barrier) {
                    if (opened_barriers.includes(barrier)) {
                        return [[]]
                    }
                    if (switchsanity.has(barrier)) {
                        return [[switchsanity.get(barrier)]];
                    }
                    return barrier.barrier_moves;
                }
                return null
            }

            // Function to set a cookie
            function setCookie(name, value, days) {
                var expires = "";
                if (days) {
                    var date = new Date();
                    date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                    expires = "; expires=" + date.toUTCString();
                }
                document.cookie = name + "=" + (value || "") + expires + "; path=/";
            }

            // Function to get a cookie value
            function getCookie(name) {
                var nameEQ = name + "=";
                var cookies = document.cookie.split(';');
                for (var i = 0; i < cookies.length; i++) {
                    var cookie = cookies[i];
                    while (cookie.charAt(0) === ' ') {
                        cookie = cookie.substring(1, cookie.length);
                    }
                    if (cookie.indexOf(nameEQ) === 0) {
                        return cookie.substring(nameEQ.length, cookie.length);
                    }
                }
                return null;
            }

            function convertSettingsToString() {
                let switch_str = 0;
                barrier_flags.forEach((id, index) => {
                    const elem = document.getElementById(id);
                    if (elem && elem.checked) { // Ignore deprecated flags
                        switch_str |= (1 << index);
                    }
                });

                const select_indexes = switch_settings.map(id => document.getElementById(id).selectedIndex);

                const fullMedal = document.getElementById("cb-req-count").getAttribute("fullMedal");
                const halfMedal = document.getElementById("cb-req-count").getAttribute("halfMedal");
                return `${switch_str.toString(16)}|${select_indexes.join("")}|${fullMedal}|${halfMedal || 0}|1`
            }

            function parseCustomPreset(json) {
                let preset = { name: json.name, barriers: [], switchsanity: new Map() };
                const segs = json.setstr.split("|");
                const version = parseInt(segs[4]) || 0;
                if (version > 1) return; // Unknown version 

                // Toggles
                const raw_val = parseInt(segs[0], 16);
                barrier_flags.forEach((bit, index) => {
                    if (raw_val & (1 << index)) {
                        preset.barriers.push(bit);
                    }
                });
                // Legacy handling for green tunnel (now two flags)
                if (preset.barriers.includes("switchForestGreen")) {
                    preset.barriers.push("selectForestGreenTunnelFeather", "selectForestGreenTunnelPineapple");
                }

                switch_settings.forEach((id, index) => {
                    if (index >= segs[1].length) return;

                    const elem = document.getElementById(id);
                    const value = elem.options[parseInt(segs[1][index])].value;
                    const name = id.slice("select".length);

                    if (id == "selectGalleonWater") {
                        preset.galleon_water = value;
                    } else if (id == "selectForestTime") {
                        preset.fungi_time = value;
                    } else if (value == "Opened") {
                        preset.barriers.push(id);
                    } else if (value == "Any Gun") {
                        preset.switchsanity.set(Moves[name], Moves.AnyGun);
                    } else if (value == "Any Instrument") {
                        preset.switchsanity.set(Moves[name], Moves.AnyInstrument);
                    } else if (value == "Random") {
                        preset.switchsanity.set(Moves[name], Moves[name + "Random"]);
                    } else {
                        preset.switchsanity.set(Moves[name], Moves[value]);
                    }
                });
                
                // CB Count
                preset.full_medal = parseInt(segs[2]);
                preset.half_medal = parseInt(segs[3]);

                return preset;
            }

                    const name = elem.id.slice("select".length);
                    const switched_move = p.switchsanity.get(Moves[name])

                        elem.value = Moves[name].barrier_moves[0][0].name;

            movesToHTML = (list) => {

            getRequiredMoves = () => {
                const threshold = getMedalRequirement();
                const level = document.getElementById("medal-level").value;
                const kong = document.getElementById("medal-kong").value;
                if (level == "default") {
                    return;
                }
                if (kong == "default") {
                    return;
                }
                if (threshold == 0) {
                    return;
                }
                // Reset everything just in case
                const levels = [
                    "Japes",
                    "Aztec",
                    "Factory",
                    "Galleon",
                    "Fungi",
                    "Caves",
                    "Castle",
                ]
                const kongs = [
                    "DK",
                    "Diddy",
                    "Lanky",
                    "Tiny",
                    "Chunky",
                ]
                updateHighlightedItem("");

                levels.forEach(level => {
                    kongs.forEach(kong => {
                        requirement_data[level][kong].forEach(g => {
                            g.reset();
                        })
                    })
                })
                let list = requirement_data[level][kong].slice();
                // Precalcate list to handle barriers
                for (let i = 0; i < 3; i++) {
                    list.forEach(item => {
                        let anyRequirementIsMoveless = false;
                        item.requirements = item.requirements.flatMap(group => {
                            // Get list of move extensions and removals
                            let purged_moves = [];
                            let extension_alternatives = [[]];
                            group.forEach(move_set => {
                                if (move_set == Moves.AllWarps) {
                                    // If all warps are preactivated, purge the AllWarps move so that this move_set is free.
                                    if (opened_barriers.includes(Moves.AllWarps)) {
                                        purged_moves.push(move_set);
                                    }
                                } else if (move_set.is_barrier) {
                                    replacement_moves = getBarrierRequirement(move_set);
                                    if (replacement_moves != null) {
                                        purged_moves.push(move_set);
                                        extension_alternatives = extension_alternatives.flatMap(alternative => replacement_moves.map(replacement => alternative.concat(replacement)))
                                    }
                                }
                            })
                            // remove/extend group
                            group = group.filter(k => !purged_moves.includes(k)).slice();
                            return extension_alternatives.map(alternative => group.concat(alternative).slice());
                        }).map(group => {
                            // Correct moveless situations
                            moveless_check = group.filter(k => k != Moves.Moveless)
                            if (moveless_check.length > 0) {
                                // If there's move requirements, filter out all "moveless" entries
                                group = moveless_check.slice()
                            } else if ((moveless_check.length == 0) && (group.length == 0)) {
                                // No moves in here at all
                                group = [Moves.Moveless].slice();
                                anyRequirementIsMoveless = true;
                            }
                            return group;
                        })

                        // Small bugfix: There may be multiple requirements to get an item. If one of those requirements
                        // is completely satisfied by presets, it becomes moveless and should compleetely erase all other requirements.
                        // For example, some Lanky CBs in Fungi require [[Climbing], [Balloon]], but when Climbing is in the preset,
                        // we should never consider them to logically require Balloon.
                        // Thus, if we detect that any requirement group became moveless, we remove all other requirements.
                        if (anyRequirementIsMoveless) {
                            item.requirements = [[Moves.Moveless]];
                        }
                    })
                }

                // Calculate all moves in this list
                let updated_threshold = threshold;
                let all_moves = [];
                list.forEach(item => {
                    item.requirements.forEach(group => {
                        group.forEach(move_set => {
                            if (move_set == Moves.AllWarps) {
                                // All Warps is off; this branch is unsatisfiable.
                            } else if (move_set.requires_moves) {
                                if (!all_moves.includes(move_set)) {
                                    all_moves.push(move_set);
                                }
                            } else {
                                updated_threshold -= item.amount;
                            }
                        })
                    })
                })
                const dump_hook = document.getElementById("permutations")
                dump_hook.innerHTML = ""
                if (updated_threshold > 0) {
                    let beat_permutations = [];
                    const perms = Math.pow(2, all_moves.length);
                    // Owning all 5 guns covers any single gun, and owning any gun/instrument covers the "Any" variants.
                    const gun_moves = all_moves.filter(move => move instanceof Moves.GunMove);
                    const instrument_moves = all_moves.filter(move => move instanceof Moves.InstrumentMove);
                    const expandMoves = (move_list) => {
                        if (move_list.includes(Moves.CheckOfLegends)) {
                            move_list = move_list.concat(gun_moves);
                        }
                        if (move_list.filter(move => gun_moves.includes(move)).length > 0) {
                            move_list = move_list.concat([Moves.AnyGun]);
                        }
                        if (move_list.filter(move => instrument_moves.includes(move)).length > 0) {
                            move_list = move_list.concat([Moves.AnyInstrument]);
                        }
                        return move_list;
                    }
                    for (let i = 0; i < perms; i++) {
                        const local_moves = all_moves.filter((move, index) => (i & Math.pow(2, index)) != 0);
                        const owned_moves = expandMoves(local_moves);
                        local_total = updated_threshold;
                        list.forEach(item => {
                            if (item.can_acquire(owned_moves)) {
                                local_total -= item.amount;
                            }
                        })
                        if (local_total <= 0) {
                            beat_permutations.push(local_moves)
                        }
                    }
                    beat_permutations.sort((a, b) => (a.length > b.length) ? 1 : ((b.length > a.length) ? -1 : 0));
                    let filtered_permutations = []
                    let checker = (arr, target) => target.every(v => arr.includes(v));
                    beat_permutations.forEach((perm, index_a) => {
                        let include = true;
                        beat_permutations.forEach((previous_perm, index_b) => {
                            if (index_b < index_a) {
                                if (checker(perm, previous_perm)) {
                                    include = false;
                                }
                            }
                        })
                        added = perm.slice();
                        added.sort((a, b) => a.name.localeCompare(b.name));
                        if (include) {
                            filtered_permutations.push(added);
                        }
                    })

                    // Sort permutations before rendering for improved readability.
                    // 1. Number of moves, ascending (fewer requirements listed first)
                    // 2. Alphabetical by first move (ties broken by second move, etc)
                    filtered_permutations.sort((a, b) => {
                        if (a.length != b.length) return Math.sign(a.length - b.length);

                        for (var i = 0; i < a.length; i++) {
                            if (a[i].name != b[i].name) return a[i].name.localeCompare(b[i].name);
                        }

                        return 0;
                    });
                    dump_hook.appendChild(movesToHTML(filtered_permutations));
                    return
                }
                dump_hook.appendChild(movesToHTML([[Moves.Moveless]]));
            }

            const recalculators = document.getElementsByClassName("recalculate");
            for (let recalculator of recalculators) {
                if (recalculator.id == "cb-req-count") { // Special handling for the CB counter, specifically
                    var saveCbReqAndGetRequiredMoves = function() {
                        if (document.getElementById("cb-req-desc").innerText == "Medal Requirement") {
                            recalculator.setAttribute("fullMedal", recalculator.value);
                        } else {
                            recalculator.setAttribute("halfMedal", recalculator.value);
                        }
                        getRequiredMoves();
                    };
                    recalculator.addEventListener("keyup", saveCbReqAndGetRequiredMoves);
                    recalculator.addEventListener("mouseup", saveCbReqAndGetRequiredMoves);
                } else {
                    recalculator.addEventListener("change", getRequiredMoves);
                }
            }
        </script>
